#################################################################################################
# Note: The Wiz Unifed Helm Chart is deployed at Lab start.                                     #
#       See https://docs.wiz.io/docs/unified-helm-chart if you are interested in learning more. #
#################################################################################################

global:
  wizApiToken:
    secret:
      create: false
      name: wiz-api-token
 
wiz-kubernetes-connector:
  enabled: true
  autoCreateConnector:
    clusterFlavor: EKS
  wiz-broker:
    enabled: true
 
wiz-sensor:
  enabled: true
  imagePullSecret:
    create: false
    name: sensor-image-pull
 
wiz-admission-controller:
  enabled: true
  kubernetesAuditLogsWebhook:
    enabled: true