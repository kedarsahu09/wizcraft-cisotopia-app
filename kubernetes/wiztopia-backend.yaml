---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: wiztopia
  labels:
    name: wiztopia

---
# ConfigMaps
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiztopia-backend-config
  namespace: wiztopia
data:
  PORT: "4000"
  NODE_ENV: "production"
  DATABASE_CLIENT: "pg"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  REDIS_SESSION_URL: "redis://redis-session:6379/0"
  REDIS_CART_URL: "redis://redis-cart:6379/1"
  CORS_ORIGIN: "*"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: wiztopia
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379
    maxmemory 128mb
    maxmemory-policy allkeys-lru

---
# ServiceAccount for IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wiztopia-db-sa
  namespace: wiztopia
  annotations:
    eks.amazonaws.com/role-arn: "placeholder"

---
# Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiztopia-backend
  namespace: wiztopia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wiztopia-backend
  template:
    metadata:
      labels:
        app: wiztopia-backend
    spec:
      serviceAccountName: wiztopia-db-sa
      containers:
      - name: wiztopia-backend
        image: "686633026196.dkr.ecr.us-east-1.amazonaws.com/cisotopia-repo2353127:backend"
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: wiztopia-backend-config
        env:
        - name: DATABASE_URL
          value: "postgresql://ciso:VEnlzDhsidlRX0oludsi35yZ8VdmV@cisotopia-rds2353127.cu1y6agy8s1d.us-east-1.rds.amazonaws.com:5432/cisotopiadb2353127?sslmode=no-verify"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /products/toys
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /products/toys
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: wiztopia-backend
  namespace: wiztopia
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: wiztopia-backend

---
# Redis Session
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-session
  namespace: wiztopia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-session
  template:
    metadata:
      labels:
        app: redis-session
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
      volumes:
      - name: config
        configMap:
          name: redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis-session
  namespace: wiztopia
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-session

---
# Redis Cart
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: wiztopia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
      volumes:
      - name: config
        configMap:
          name: redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: wiztopia
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-cart
